[project]
name = "scriptindexer"
version = "2.0.0"
description = "Extract, analyze and browse Legend of Mortal script assets"
requires-python = ">=3.14"
dependencies = [
  "pillow>=12.0",
  "unitypy>=1.25.2",
  "typetreegeneratorapi>=0.0.10",
  "tree-sitter>=0.26.0",
  "tree-sitter-lua>=0.5.0",
]

[project.scripts]
scriptindexer-extract = "scriptindexer.cli.extract:main"
scriptindexer-build = "scriptindexer.cli.build:main"
scriptindexer-portraits = "scriptindexer.cli.portraits:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scriptindexer"]

